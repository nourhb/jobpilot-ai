apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: jobpilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: jobpilot-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: jobpilot-config
            - secretRef:
                name: jobpilot-secrets
          volumeMounts:
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: storage
          emptyDir: {}
